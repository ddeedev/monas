[package]
name = "assets"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/assets.rs"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
# `include-exclude` is required for the #[include]/#[exclude] derive attributes;
# declare it here instead of relying on feature unification from the workspace.
rust-embed = { workspace = true, features = ["include-exclude"] }
